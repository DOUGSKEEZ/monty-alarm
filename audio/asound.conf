# Monty alarm audio: everything plays on the Fosi Audio ZD3 (USB), found by
# its card name so it doesn't matter what number it gets. The "Alarm" software
# volume control is what alarm_trigger.py ramps up (amixer -c ZD3 sset Alarm).
# Installed to /etc/asound.conf by scripts/install.sh.

pcm.!default {
    type plug
    slave.pcm "alarm_volume"
}

pcm.alarm_volume {
    type softvol
    slave.pcm "plughw:CARD=ZD3,DEV=0"
    control {
        name "Alarm"
        card ZD3
    }
}

ctl.!default {
    type hw
    card ZD3
}
